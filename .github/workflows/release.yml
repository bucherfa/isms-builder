name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        # Verhindert die Drift, die zu v1.37.5.1 gefuehrt hat: der Tag wurde
        # gepusht, ohne vorher scripts/bump-version.sh laufen zu lassen, und
        # package.json blieb auf der Vorversion stehen — die App zeigte danach
        # (siehe /api/version) die falsche Version an, bis das manuell auffiel.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu package.json (${PKG_VERSION}). Vor dem Taggen 'bash scripts/bump-version.sh ${TAG_VERSION}' ausfuehren und committen."
            exit 1
          fi
          echo "OK: Tag ${GITHUB_REF_NAME} passt zu package.json (${PKG_VERSION})"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret
          STORAGE_BACKEND: json

      - name: Create deployment archive
        run: |
          tar --exclude=node_modules --exclude=data --exclude=ssl \
              --exclude=.env --exclude='.git' --exclude='*.log' \
              --warning=no-file-changed \
              -czf isms-builder-${{ github.ref_name }}.tar.gz . || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: isms-builder-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          body: |
            ## ISMS Builder ${{ github.ref_name }}

            ### Quick Start
            ```bash
            tar -xzf isms-builder-${{ github.ref_name }}.tar.gz
            npm install
            cp .env.example .env   # JWT_SECRET setzen
            npm start
            ```

            See [CHANGELOG](CHANGELOG.md) and [documentation](docs/ISMS-build-documentation.md) for details.
